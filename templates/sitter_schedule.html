{% extends "base.html" %}
{% block title %}My Schedule — Paw Hub{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
  <div>
    <h4 class="fw-bold mb-0">My Schedule</h4>
    <p class="text-muted small mb-0">Upcoming confirmed bookings (approved applications only)</p>
  </div>
  <a href="{{ url_for('sitter_services') }}" class="btn btn-primary btn-sm px-3">
    <i class="bi bi-search me-1"></i>Browse Services
  </a>
</div>

<!-- Week navigation -->
<div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
  <button class="btn btn-outline-secondary btn-sm px-3" id="prev-week">
    <i class="bi bi-chevron-left"></i>
  </button>
  <span class="fw-semibold" id="week-label" style="min-width:220px;text-align:center;"></span>
  <button class="btn btn-outline-secondary btn-sm px-3" id="next-week">
    <i class="bi bi-chevron-right"></i>
  </button>
  <button class="btn btn-outline-primary btn-sm px-3 ms-2" id="today-btn">Today</button>

  <!-- Legend -->
  <div class="d-flex gap-3 ms-auto flex-wrap small">
    <span><span class="sched-dot" style="background:#3b82f6"></span> Approved (Upcoming)</span>
  </div>
</div>

<!-- Calendar grid -->
<div class="card border-0 rounded-4 shadow-sm overflow-hidden">
  <div class="sched-grid-wrap">
    <div id="sched-grid" class="sched-grid"></div>
  </div>
</div>

<!-- Details modal -->
<div class="modal fade" id="schedModal" tabindex="-1" aria-labelledby="schedModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header border-0 pb-0 px-4 pt-4">
        <h5 class="modal-title fw-bold" id="schedModalLabel">Booking Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4" id="schedModalBody"></div>
    </div>
  </div>
</div>

<!-- Pass services as JSON -->
<script type="application/json" id="sched-data">{{ schedule_services | tojson }}</script>

<style>
.sched-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.sched-grid-wrap { overflow-x: auto; }
.sched-grid {
  display: grid;
  grid-template-columns: 56px repeat(7, 1fr);
  min-width: 640px;
  position: relative;
}
.sched-header-cell {
  padding: 10px 4px;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 600;
  border-bottom: 2px solid #e2e8f0;
  background: #f8fafc;
  position: sticky;
  top: 0;
  z-index: 2;
}
.sched-header-cell.today-col { background: #eff6ff; color: #2563eb; }
.sched-time-label {
  font-size: 0.72rem;
  color: #94a3b8;
  text-align: right;
  padding-right: 8px;
  padding-top: 2px;
  line-height: 1;
  height: 60px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
}
.sched-cell {
  border-left: 1px solid #e2e8f0;
  border-bottom: 1px solid #f1f5f9;
  height: 60px;
  position: relative;
}
.sched-cell.today-col { background: #f8fbff; }
.sched-event {
  position: absolute;
  left: 3px;
  right: 3px;
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 0.72rem;
  line-height: 1.3;
  overflow: hidden;
  cursor: pointer;
  z-index: 1;
  box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  transition: filter 0.15s;
}
.sched-event:hover { filter: brightness(0.93); }
.sched-event .ev-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-event .ev-sub { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-now-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: #ef4444;
  z-index: 3;
  pointer-events: none;
}
.sched-now-line::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ef4444;
}
.sched-empty-msg {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 16px;
  color: #94a3b8;
  font-size: 0.9rem;
}
</style>

<script>
(function () {
  var RAW = JSON.parse(document.getElementById("sched-data").textContent || "[]");
  var HOUR_START = 7, HOUR_END = 22, HOUR_H = 60;
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  /* application_status drives colour for sitter */
  var STATUS_COLORS = {
    pending:   { bg: "#fef9c3", border: "#f59e0b", text: "#92400e" },
    approved:  { bg: "#dbeafe", border: "#3b82f6", text: "#1e3a8a" },
    rejected:  { bg: "#fee2e2", border: "#ef4444", text: "#7f1d1d" },
    completed: { bg: "#dcfce7", border: "#22c55e", text: "#14532d" },
  };

  function colorFor(status) {
    return STATUS_COLORS[(status||"").toLowerCase()] || STATUS_COLORS.pending;
  }

  var DUR_MAP = {
    "30 Minutes":30,"1 Hour":60,"2 Hours":120,"4 Hours":240,
    "8 Hours":480,"1 Day":1440,"2 Days":2880,"3 Days":4320,"1 Week":10080
  };
  function durMins(label) { return DUR_MAP[label] || 60; }

  function weekMonday(d) {
    var day = d.getDay();
    var diff = (day === 0) ? -6 : 1 - day;
    var m = new Date(d); m.setDate(d.getDate() + diff); m.setHours(0,0,0,0);
    return m;
  }
  function fmtDate(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function fmtDateShort(d) {
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }
  function esc(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  var weekStart = weekMonday(new Date());
  var grid = document.getElementById("sched-grid");
  var label = document.getElementById("week-label");

  function render() {
    grid.innerHTML = "";
    var today = fmtDate(new Date());
    var weekEnd = addDays(weekStart, 6);
    label.textContent = fmtDateShort(weekStart) + " – " + fmtDateShort(weekEnd);

    /* Header */
    grid.appendChild(Object.assign(document.createElement("div"), { className: "sched-header-cell" }));
    var cols = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(weekStart, i);
      var ds = fmtDate(d);
      cols.push(ds);
      var hdr = document.createElement("div");
      hdr.className = "sched-header-cell" + (ds === today ? " today-col" : "");
      hdr.innerHTML = "<div>" + DAYS[d.getDay()] + "</div><div style='font-size:1.1rem;font-weight:700'>" + d.getDate() + "</div>";
      grid.appendChild(hdr);
    }

    var hasEvents = false;
    for (var h = HOUR_START; h < HOUR_END; h++) {
      var tl = document.createElement("div");
      tl.className = "sched-time-label";
      tl.textContent = h + ":00";
      grid.appendChild(tl);

      for (var c = 0; c < 7; c++) {
        var cell = document.createElement("div");
        cell.className = "sched-cell" + (cols[c] === today ? " today-col" : "");

        RAW.forEach(function(svc) {
          if (svc.service_date !== cols[c]) return;
          var parts = (svc.service_time || "00:00").split(":");
          var sHour = parseInt(parts[0], 10);
          var sMin  = parseInt(parts[1] || "0", 10);
          if (sHour !== h) return;

          hasEvents = true;
          var mins = durMins(svc.duration);
          var topPx    = (sMin / 60) * HOUR_H;
          var heightPx = Math.max(22, (mins / 60) * HOUR_H - 2);
          var col = colorFor(svc.application_status);

          var ev = document.createElement("div");
          ev.className = "sched-event";
          ev.style.cssText = "top:" + topPx + "px;height:" + heightPx + "px;" +
            "background:" + col.bg + ";border-left:3px solid " + col.border + ";color:" + col.text + ";";
          ev.innerHTML =
            "<div class='ev-title'>" + esc(svc.service_type) + "</div>" +
            "<div class='ev-sub'>" + esc(svc.pet_type) + " · " + esc(svc.service_time) + "</div>";
          ev.addEventListener("click", function(e) {
            e.stopPropagation();
            document.getElementById("schedModalLabel").textContent = svc.service_type;
            document.getElementById("schedModalBody").innerHTML =
              "<span class='badge bg-primary rounded-pill mb-3 px-3'>" +
                "<i class='bi bi-check-circle me-1'></i>Approved — Upcoming" +
              "</span>" +
              "<div class='alert alert-info py-2 small mb-3'>" +
                "<i class='bi bi-telephone me-1'></i>" +
                "<strong>" + esc(svc.owner_name) + "</strong> will contact you with the full address." +
              "</div>" +
              "<table class='table table-sm table-borderless mb-0'><tbody>" +
              "<tr><th class='text-muted fw-normal w-50'>Date</th><td class='fw-semibold'>" + esc(svc.service_date) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Time</th><td class='fw-semibold'>" + esc(svc.service_time) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Duration</th><td class='fw-semibold'>" + esc(svc.duration) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Service Type</th><td class='fw-semibold'>" + esc(svc.service_type) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Pet Type</th><td class='fw-semibold'>" + esc(svc.pet_type) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>No. of Pets</th><td class='fw-semibold'>" + esc(svc.number_of_pets) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Location</th><td class='fw-semibold'>" + esc(svc.location) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Salary</th><td class='fw-semibold text-success'>RM " + Number(svc.salary).toFixed(2) + "</td></tr>" +
              "<tr><th class='text-muted fw-normal'>Posted by</th><td class='fw-semibold'>" + esc(svc.owner_name) + "</td></tr>" +
              "</tbody></table>";
            var modalEl = document.getElementById("schedModal");
            var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
          });
          cell.appendChild(ev);
        });

        /* Current time indicator */
        if (cols[c] === today) {
          var now = new Date();
          if (now.getHours() === h) {
            var line = document.createElement("div");
            line.className = "sched-now-line";
            line.style.top = (now.getMinutes() / 60 * HOUR_H) + "px";
            cell.appendChild(line);
          }
        }

        grid.appendChild(cell);
      }
    }

    if (!hasEvents) {
      var msg = document.createElement("div");
      msg.className = "sched-empty-msg";
      msg.innerHTML = "<i class='bi bi-calendar3 fs-2 d-block mb-2'></i>No approved bookings this week. Navigate to other weeks or check your Applications.";
      grid.appendChild(msg);
    }
  }

  document.getElementById("prev-week").addEventListener("click", function() { weekStart = addDays(weekStart,-7); render(); });
  document.getElementById("next-week").addEventListener("click", function() { weekStart = addDays(weekStart, 7); render(); });
  document.getElementById("today-btn").addEventListener("click", function() { weekStart = weekMonday(new Date()); render(); });

  render();
})();
</script>
{% endblock %}
