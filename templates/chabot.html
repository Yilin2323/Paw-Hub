{# Paw Hub Assistant — included when logged_in. #}
<div
  class="ph-chatbot"
  id="ph-chatbot"
  data-ph-chatbot
  data-ph-chat-url="{{ url_for('chatbot_message') }}"
>
  <button
    type="button"
    class="ph-chatbot-fab"
    id="ph-chatbot-toggle"
    aria-expanded="false"
    aria-controls="ph-chatbot-panel"
    title="Open Paw Hub Assistant"
  >
    <i class="bi bi-robot" aria-hidden="true"></i>
    <span class="ph-chatbot-fab-label">Paw Hub Assistant</span>
  </button>

  <div
    class="ph-chatbot-panel ph-chatbot-panel--closed"
    id="ph-chatbot-panel"
    role="dialog"
    aria-labelledby="ph-chatbot-title"
    aria-hidden="true"
    inert
  >
    <header class="ph-chatbot-header">
      <h2 id="ph-chatbot-title" class="ph-chatbot-title">Paw Hub Assistant</h2>
      <button type="button" class="ph-chatbot-close" id="ph-chatbot-close" aria-label="Close chat">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <div class="ph-chatbot-body">
      <div class="ph-chatbot-messages" id="ph-chatbot-messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="ph-chatbot-msg ph-chatbot-msg--bot" data-ph-welcome>
          <div class="ph-chatbot-bubble">
            Hi! Let’s find your next step. What would you like help with?
          </div>
        </div>
      </div>
    </div>

    <footer class="ph-chatbot-guide">
      <div class="ph-chatbot-guide-label" id="ph-chatbot-topic">Main menu</div>
      <div class="ph-chatbot-quick" id="ph-chatbot-quick" role="group" aria-label="Choose your next step">
        <button type="button" class="ph-chatbot-chip" data-ph-choice="find">How to look for a service</button>
        <button type="button" class="ph-chatbot-chip" data-ph-choice="apply">How to apply</button>
        <button type="button" class="ph-chatbot-chip" data-ph-choice="journey">How to start my journey</button>
      </div>
      <nav class="ph-chatbot-nav" aria-label="Help navigation">
        <button type="button" id="ph-chatbot-back" disabled>← Back</button>
        <span>Choose an option to continue</span>
        <button type="button" id="ph-chatbot-home" disabled>Main menu</button>
      </nav>
    </footer>

    <div
      class="ph-chatbot-resize-grip"
      id="ph-chatbot-resize-grip"
      aria-hidden="true"
      title="Drag to resize"
    ></div>
  </div>
</div>
